[package]
name = "devdock"
version = "0.1.0"
description = "DevDock — Floating developer dock for AI coding"
authors = ["you"]
edition = "2021"

[lib]
name = "devdock_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["macos-private-api", "tray-icon", "image-png"] }
tauri-plugin-opener = "2"
tauri-plugin-store = "2"
tauri-plugin-global-shortcut = "2"
tauri-plugin-shell = "2"
tauri-plugin-autostart = "2"
tauri-plugin-notification = "2"
tauri-plugin-updater = "2"
tauri-plugin-prevent-default = "4"
tauri-plugin-nosleep = "2.0.0-beta.1"
sentry = { version = "0.34", default-features = false, features = ["backtrace", "contexts", "panic", "reqwest", "rustls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
specta = { version = "2.0.0-rc.22", features = ["derive"] }
tauri-specta = { version = "2.0.0-rc.21", features = ["derive", "typescript"] }
specta-typescript = "0.0.9"
screenshots = "0.8"
cpal = "0.15"
hound = "3.5"
arboard = "3"
base64 = "0.22"
image = { version = "0.25", features = ["png"] }
shlex = "1"
tokio = { version = "1", features = ["time"] }
sysinfo = "0.33"
url = "2"
log = "0.4"
tauri-plugin-mcp-bridge = "0.8.3"

[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.58", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging"] }

[target.'cfg(target_os = "macos")'.dependencies]
tauri-plugin-macos-permissions = "2"
tauri-nspanel = { git = "https://github.com/ahkohd/tauri-nspanel", branch = "v2" }

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = "debuginfo"
panic = "abort"
